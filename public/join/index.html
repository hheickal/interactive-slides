<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the lecture</title>
<style>
  :root {
    color-scheme: light dark;
    --surface: #fcfcfb;
    --text: #0b0b0b;
    --muted: #898781;
    --line: #e1e0d9;
    --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --surface: #1a1a19; --text: #ffffff; --line: #2c2c2a; --accent: #3987e5; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: 100%; max-width: 22rem; }
  h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 0.35rem; }
  p.muted { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.25rem; }
  form { display: flex; gap: 0.5rem; }
  input {
    flex: 1;
    min-width: 0;
    padding: 0.85rem 1rem;
    font: inherit;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  button {
    padding: 0.85rem 1.3rem;
    font: inherit;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <h1>Join the lecture</h1>
  <p class="muted">Enter the code shown on the screen. Your phone will follow
    the slides and you can answer polls as they come up.</p>
  <form id="f">
    <input id="c" autocomplete="off" autocapitalize="characters" placeholder="CODE" required>
    <button type="submit">Join</button>
  </form>
</main>

<script type="module">
// This page is only a doorway: the deck itself is what students follow, so a
// code here turns into a follow-mode deck URL. Everything else lives in the
// deck, which means one poll implementation rather than two.
function enter(code) {
  location.replace(`../?room=${encodeURIComponent(code)}&follow=1`)
}

const preset = new URLSearchParams(location.search).get('room')
if (preset) {
  enter(preset.toUpperCase())
}
else {
  document.getElementById('f').onsubmit = (e) => {
    e.preventDefault()
    const code = document.getElementById('c').value.trim().toUpperCase()
    if (code) enter(code)
  }
}
</script>
</body>
</html>
